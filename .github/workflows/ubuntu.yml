name: ubuntu
on:
  workflow_dispatch:
    inputs:
      attempt_id:
        description: Server-owned logical Attempt
        type: string
        required: true
      dispatch_id:
        description: Server-owned dispatch correlation
        type: string
        required: true
      capability_id:
        description: Server-owned capability
        type: string
        required: true
      duration_minutes:
        description: Session lifetime in minutes (1-300)
        type: number
        default: 300
        required: false

      session_mode:
        description: Fixed or temporary Tailnet hostname
        type: choice
        options:
          - fixed
          - temporary
        default: fixed
        required: false
      duration_mode:
        description: Explicit minutes or repository session default
        type: choice
        options:
          - explicit
          - repository
        default: explicit
        required: false

env:
  WORKFLOW_ACTION_TYPE: session

permissions:
  contents: read
  id-token: write

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      ATTEMPT_ID: ${{ inputs.attempt_id }}
      DISPATCH_ID: ${{ inputs.dispatch_id }}
      CAPABILITY_ID: ${{ inputs.capability_id }}
      WORKFLOW_ACTION_CLAIM_URL: ${{ vars.WORKFLOW_ACTION_CLAIM_URL }}
      WORKFLOW_ACTION_OIDC_AUDIENCE: ${{ vars.WORKFLOW_ACTION_OIDC_AUDIENCE }}
      DURATION_MINUTES: ${{ inputs.duration_mode == 'repository' && (vars.SESSION_DURATION_MINUTES || '300') || inputs.duration_minutes }}
      SESSION_TAILSCALE_HOSTNAME: ${{ inputs.session_mode == 'fixed' && 'session-ubuntu' || format('sa-{0}-a{1}', github.run_id, github.run_attempt) }}
    steps:
      - name: Capture job lifetime before checkout
        shell: bash
        run: date +%s > "$RUNNER_TEMP/session-action-start"
      - name: Checkout pinned dispatched revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Record Runner-local bounded lifetime
        run: python3 .github/scripts/session_action.py start
      - name: Claim approved physical GitHub Run
        run: python3 .github/scripts/session_action.py claim
      - name: Join private Tailnet (ephemeral OIDC identity)
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:session-actions
          hostname: ${{ env.SESSION_TAILSCALE_HOSTNAME }}
      - name: Verify allocated Tailnet name before privileged access
        shell: bash
        run: python3 .github/scripts/verify-tailnet-name.py
      - name: Configure Ubuntu Runner password SSH on Tailnet
        shell: bash
        env:
          SESSION_SYSTEM_PASSWORD: ${{ secrets.SESSION_SYSTEM_PASSWORD }}
        run: bash .github/scripts/ubuntu-ssh.sh
      - name: Signed Ready after private SSH is configured
        run: python3 .github/scripts/session_action.py ready
      - name: Hold until selected lifetime or GitHub cancellation
        run: python3 .github/scripts/session_action.py hold
      - name: Stop Ubuntu SSH and remove session settings
        if: always()
        shell: bash
        run: |
          sudo systemctl stop ssh.service ssh.socket || true
          sudo rm -f /etc/ssh/sshd_config.d/00-session-actions.conf
          sudo rm -f /run/systemd/system/ssh.socket.d/00-session-actions.conf
          sudo systemctl daemon-reload || true
          sudo tailscale set --ssh=false || true
