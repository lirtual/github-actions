name: Static Workflow Contract
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/**
      - README.md
      - .github/scripts/**
      - tests/**
  pull_request:
    paths:
      - .github/workflows/**
      - README.md
      - .github/scripts/**
      - tests/**

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate GitHub Workflow syntax and expressions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/*.yml
      - name: Test shared GitHub OIDC and bounded Session protocol
        run: |
          python3 -m py_compile .github/scripts/session_action.py
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Verify pinned cloudflared supports protected Quick Tunnels
        shell: bash
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/cloudflared-otp"
          curl --fail --location --proto '=https' --retry 2 --silent --show-error --tlsv1.2 \
            'https://github.com/cloudflare/cloudflared/releases/download/2026.10.3/cloudflared-linux-amd64' \
            --output "$binary"
          printf '%s  %s\n' '053b80b0a23031a038fdbf3c073f59f82b8f1f152aa67971d7383ffafc0dbab0' "$binary" | sha256sum -c --status
          chmod 0700 "$binary"
          "$binary" --version | grep -Fq '2026.10.3'
          "$binary" tunnel --help 2>&1 | grep -F -- '--allowed-mail'
          # Fail closed when no explicit email recipient is configured.
          if SESSION_SERVICE=chrome SESSION_TUNNEL_ALLOWED_EMAIL='' bash .github/scripts/start-tunnel.sh; then
            echo 'Tunnel started without an allowed recipient' >&2
            exit 1
          fi
      - name: Check Ubuntu Runner password SSH prerequisites (read-only)
        shell: bash
        run: |
          bash -n .github/scripts/ubuntu-ssh.sh
          test "$(id -un)" = runner
          test -x /usr/sbin/sshd
          grep -Eq '^[[:space:]]*Include[[:space:]]+/etc/ssh/sshd_config.d/\*\.conf' /etc/ssh/sshd_config
      - name: Parse Windows SSH configuration script
        shell: pwsh
        run: |
          $tokens = $null
          $errorsFound = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.github/scripts/windows-ssh.ps1').Path, [ref]$tokens, [ref]$errorsFound) | Out-Null
          if ($errorsFound.Count -ne 0) { throw 'Invalid Windows SSH script syntax' }

  smoke-linux-services:
    # This executes only isolated, loopback-bound services. It intentionally
    # has NO repository/Tailnet secrets, OIDC, dispatch or Workflow MCP grants.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [chrome, code-server]
    steps:
      - name: Checkout without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify actual Session launch script shell syntax
        shell: bash
        run: bash -n .github/scripts/start-*.sh
      - name: Start the same local service script used by the Session
        shell: bash
        run: bash ".github/scripts/start-${{ matrix.service }}.sh"
      - name: Ensure no service listens on wildcard/public addresses
        shell: bash
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          case "$SERVICE" in
            chrome) PORT=3000 ;;
            code-server) PORT=8080 ;;
            openlist) PORT=5244 ;;
            *) exit 1 ;;
          esac
          ss -lnt | grep -E "127\\.0\\.0\\.1:${PORT}[[:space:]]"
          if ss -lnt | grep -E "(0\\.0\\.0\\.0|\\*|\\[::\\]):${PORT}[[:space:]]"; then
            echo "Service must not listen on a public interface" >&2
            exit 1
          fi
      - name: Assert password-free loopback GUI is ready for the protected Tunnel
        shell: bash
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          case "$SERVICE" in
            chrome) PORT=3000 ;;
            code-server) PORT=8080 ;;
            *) exit 1 ;;
          esac
          test "$(curl --silent --max-time 5 --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:$PORT/")" = 200
          # Verify no native login page/auth challenge survives.
          ! curl --silent --max-time 5 -D - -o /dev/null "http://127.0.0.1:$PORT/" | grep -Eiq '^www-authenticate:'

      - name: Remove transient local service
        if: always()
        shell: bash
        run: |
          if test -s "$RUNNER_TEMP/session-service.pid"; then
            kill "$(cat "$RUNNER_TEMP/session-service.pid")" 2>/dev/null || true
          fi
          docker rm --force session-openlist session-chrome >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/session-service-password"

  smoke-openlist-mysql:
    # Exercises the real startup script with a throwaway TLS MySQL Docker
    # container. No repo Secrets, Aiven credentials, or Workflow MCP grants.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate integration test script syntax
        shell: bash
        run: bash -n .github/scripts/test-openlist-mysql.sh
      - name: Test real OpenList startup and persistent TLS MySQL restart
        shell: bash
        run: bash .github/scripts/test-openlist-mysql.sh

  smoke-protected-quick-tunnel:
    # No Actions Secrets, Workflow MCP access or production services. The
    # external endpoint serves only a disposable, synthetic CI marker.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Start synthetic loopback origin
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tunnel-fixture"
          python3 - <<'PY'
          import secrets
          import os
          from pathlib import Path
          temp = Path(os.environ["RUNNER_TEMP"])
          value = "CI_ORIGIN_ONLY_" + secrets.token_hex(18)
          (temp / "tunnel-fixture" / "index.html").write_text(value)
          (temp / "tunnel-expected").write_text(value)
          PY
          python3 -m http.server 8080 --bind 127.0.0.1 --directory "$RUNNER_TEMP/tunnel-fixture" \
            > "$RUNNER_TEMP/tunnel-fixture.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/tunnel-fixture.pid"
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:8080/ >/dev/null; then
              exit 0
            fi
            if [[ "$attempt" -lt 5 ]]; then sleep 1; fi
          done
          echo 'Synthetic origin did not start' >&2
          exit 1
      - name: Launch email-OTP protected Quick Tunnel
        shell: bash
        env:
          SESSION_SERVICE: code-server
          SESSION_TUNNEL_ALLOWED_EMAIL: ${{ vars.SESSION_TUNNEL_ALLOWED_EMAIL }}
        run: bash .github/scripts/start-tunnel.sh
      - name: Assert unauthenticated HTTPS cannot reach synthetic origin
        shell: bash
        run: |
          set -euo pipefail
          url="$(cat "$RUNNER_TEMP/session-tunnel-url")"
          case "$url" in
            https://*.trycloudflare.com) ;;
            *) echo 'Unexpected Quick Tunnel hostname' >&2; exit 1 ;;
          esac
          marker="$(cat "$RUNNER_TEMP/tunnel-expected")"
          test "$(curl --fail --silent --max-time 2 http://127.0.0.1:8080/)" = "$marker"
          status="$(curl --silent --show-error --max-time 15 --output "$RUNNER_TEMP/tunnel-anonymous-body" \
            --dump-header "$RUNNER_TEMP/tunnel-anonymous-headers" --write-out '%{http_code}' "$url/")"
          test "$status" = 302
          grep -Eqi '^location: https://login\.trycloudflare\.com/authorize\?' "$RUNNER_TEMP/tunnel-anonymous-headers"
          if grep -Fq "$marker" "$RUNNER_TEMP/tunnel-anonymous-body"; then
            echo 'Protected Quick Tunnel exposed the private test origin anonymously' >&2
            exit 1
          fi
          # An unauthenticated unsafe method must be rejected by cloudflared,
          # not forwarded to the synthetic HTTP origin.
          post_status="$(curl --silent --show-error --max-time 15 --request POST \
            --output "$RUNNER_TEMP/tunnel-anonymous-body" --write-out '%{http_code}' "$url/")"
          test "$post_status" = 401
          if grep -Fq "$marker" "$RUNNER_TEMP/tunnel-anonymous-body"; then
            echo 'Protected Quick Tunnel exposed the origin on POST' >&2
            exit 1
          fi
          echo 'Anonymous GET redirected to OTP and POST denied'
      - name: Verify public OpenList Quick Tunnel uses native auth only
        shell: bash
        env:
          SESSION_SERVICE: openlist
          SESSION_TUNNEL_ALLOWED_EMAIL: ''
        run: |
          set -euo pipefail
          kill "$(cat "$RUNNER_TEMP/session-tunnel.pid")" 2>/dev/null || true
          mkdir -p "$RUNNER_TEMP/tunnel-fixture/api/public"
          printf '%s\n' '{"code":200,"message":"success","data":{"fixture":"openlist"}}' \
            > "$RUNNER_TEMP/tunnel-fixture/api/public/settings"
          python3 -m http.server 5244 --bind 127.0.0.1 --directory "$RUNNER_TEMP/tunnel-fixture" \
            > "$RUNNER_TEMP/openlist-fixture.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/openlist-fixture.pid"
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:5244/api/public/settings >/dev/null; then
              break
            fi
            if [[ "$attempt" -eq 5 ]]; then
              echo 'Synthetic OpenList origin did not start' >&2
              exit 1
            fi
            sleep 1
          done
          bash .github/scripts/start-tunnel.sh
          url="$(cat "$RUNNER_TEMP/session-tunnel-url")"
          marker="$(cat "$RUNNER_TEMP/tunnel-expected")"
          test "$(curl --fail --silent --max-time 15 "$url/")" = "$marker"
          test "$(curl --fail --silent --max-time 15 "$url/api/public/settings")" = \
            '{"code":200,"message":"success","data":{"fixture":"openlist"}}'
          echo 'Unauthenticated OpenList public routes reach the origin'
      - name: Close temporary Tunnel and delete fixture
        if: always()
        shell: bash
        run: |
          if test -s "$RUNNER_TEMP/session-tunnel.pid"; then
            kill "$(cat "$RUNNER_TEMP/session-tunnel.pid")" 2>/dev/null || true
          fi
          if test -s "$RUNNER_TEMP/tunnel-fixture.pid"; then
            kill "$(cat "$RUNNER_TEMP/tunnel-fixture.pid")" 2>/dev/null || true
          fi
          if test -s "$RUNNER_TEMP/openlist-fixture.pid"; then
            kill "$(cat "$RUNNER_TEMP/openlist-fixture.pid")" 2>/dev/null || true
          fi
          rm -f "$RUNNER_TEMP/session-tunnel-url" "$RUNNER_TEMP/session-tunnel.log" \
            "$RUNNER_TEMP/session-tunnel.pid" "$RUNNER_TEMP/cloudflared" \
            "$RUNNER_TEMP/tunnel-expected" "$RUNNER_TEMP/tunnel-anonymous-body" \
            "$RUNNER_TEMP/tunnel-anonymous-headers" "$RUNNER_TEMP/tunnel-fixture.pid" \
            "$RUNNER_TEMP/tunnel-fixture.log" "$RUNNER_TEMP/openlist-fixture.pid" \
            "$RUNNER_TEMP/openlist-fixture.log"
          rm -rf "$RUNNER_TEMP/tunnel-fixture"

  smoke-download-network-isolation:
    # Synthetic-only network proof on disposable GitHub-hosted Ubuntu.
    # No user URLs, AWS credentials, OpenList DB, OIDC or actual downloader.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ATTEMPT_ID: 11111111-1111-4111-8111-111111111111
    steps:
      - name: Checkout without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify sandbox script syntax and start host-only fixture
        shell: bash
        run: |
          set -euo pipefail
          bash -n .github/scripts/download-network.sh
          mkdir -p "$RUNNER_TEMP/private-fixture"
          printf '%s' 'PRIVATE_FIXTURE' > "$RUNNER_TEMP/private-fixture/index.html"
          python3 -m http.server 18081 --bind 0.0.0.0 --directory "$RUNNER_TEMP/private-fixture" > "$RUNNER_TEMP/host-fixture.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/host-fixture.pid"
          for i in 1 2 3 4 5; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:18081/ >/dev/null; then break; fi
            if [[ "$i" == 5 ]]; then exit 1; fi
            sleep 1
          done
          cat > "$RUNNER_TEMP/udp-fixture.py" <<'PYCODE'
          import socket
          udp=socket.socket(socket.AF_INET,socket.SOCK_DGRAM)
          udp.bind(('0.0.0.0',18082))
          while True:
              packet,peer=udp.recvfrom(256)
              udp.sendto(b'UDP_HOST',peer)
          PYCODE
          python3 "$RUNNER_TEMP/udp-fixture.py" > "$RUNNER_TEMP/udp-fixture.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/udp-fixture.pid"
      - name: Prepare immutable own-repository fixture and disposable aria2 image
        shell: bash
        env:
          FIXTURE_COMMIT: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$FIXTURE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          url="https://raw.githubusercontent.com/lirtual/session-actions/${FIXTURE_COMMIT}/README.md"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --max-time 30 \
            "$url" --output "$RUNNER_TEMP/spec51-public-readme"
          test -s "$RUNNER_TEMP/spec51-public-readme"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --max-time 30 \
            "https://raw.githubusercontent.com/lirtual/session-actions/${FIXTURE_COMMIT}/.github/workflows/openlist.yml" \
            --output "$RUNNER_TEMP/spec51-public-openlist-yml"
          test -s "$RUNNER_TEMP/spec51-public-openlist-yml"
          docker build --tag "sa51-aria2-smoke:$GITHUB_RUN_ID" - <<'DOCKERFILE'
          FROM python:3.12-alpine@sha256:b658b05ce9c4eb97ec6fc19424818a1f31993659c2b505a532f470e83807815d
          RUN apk add --no-cache aria2
          DOCKERFILE
      - name: Arm restricted bridge before launching any client
        shell: bash
        run: bash .github/scripts/download-network.sh setup
      - name: Verify private and metadata denial with public HTTPS positive control
        shell: bash
        run: |
          set -euo pipefail
          net="sa51-11111111"
          gateway="$(docker network inspect -f '{{(index .IPAM.Config 0).Gateway}}' "$net")"
          test "$(curl --fail --silent --max-time 3 "http://$gateway:18081/")" = PRIVATE_FIXTURE
          python3 - "$gateway" <<'PYCODE'
          import socket,sys,time
          address=(sys.argv[1],18082)
          for i in range(6):
              try:
                  with socket.socket(socket.AF_INET,socket.SOCK_DGRAM) as udp:
                      udp.settimeout(1)
                      udp.sendto(b'ping',address)
                      assert udp.recvfrom(256)[0]==b'UDP_HOST'
                      break
              except (OSError,AssertionError):
                  if i==5: raise
                  time.sleep(.3)
          PYCODE
          docker run --rm -i --network "$net" --dns 1.1.1.1 \
            --sysctl net.ipv6.conf.all.disable_ipv6=1 --cap-drop ALL \
            --security-opt no-new-privileges:true --read-only --tmpfs /tmp \
            --env "HOST_GATEWAY=$gateway" python:3.12-alpine python - <<'PYCODE'
          import os,socket
          gateway=os.environ['HOST_GATEWAY']
          for host,port in [(gateway,18081),('169.254.169.254',80),
                            ('127.0.0.1',18081),('10.0.0.1',80),
                            ('100.64.0.1',80),('192.168.1.1',80)]:
              try:
                  with socket.create_connection((host,port),timeout=2):
                      raise SystemExit('PRIVATE_EGRESS_UNSAFE')
              except OSError:
                  pass
          with socket.socket(socket.AF_INET,socket.SOCK_DGRAM) as udp:
              udp.settimeout(2)
              udp.sendto(b'ping',(gateway,18082))
              try:
                  udp.recvfrom(256)
                  raise SystemExit('PRIVATE_UDP_EGRESS_UNSAFE')
              except OSError:
                  pass
          if open('/proc/sys/net/ipv6/conf/all/disable_ipv6').read().strip()!='1':
              raise SystemExit('IPV6_NOT_DISABLED')
          try:
              with socket.create_connection(('github.com',443),timeout=12):
                  print('PUBLIC_EGRESS_ALLOWED_AND_PRIVATE_BLOCKED')
          except OSError:
              raise SystemExit('PUBLIC_EGRESS_UNAVAILABLE')
          PYCODE
      - name: Run genuine aria2 inside restricted bridge against pinned own-repository README
        shell: bash
        env:
          FIXTURE_COMMIT: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          set -euo pipefail
          net="sa51-11111111"
          gateway="$(docker network inspect -f '{{(index .IPAM.Config 0).Gateway}}' "$net")"
          export HOST_GATEWAY="$gateway"
          export PUBLIC_FIXTURE_URL="https://raw.githubusercontent.com/lirtual/session-actions/${FIXTURE_COMMIT}/README.md"
          PUBLIC_FIXTURE_SHA256="$(sha256sum "$RUNNER_TEMP/spec51-public-readme" | cut -d' ' -f1)"
          export PUBLIC_FIXTURE_SHA256
          export PUBLIC_FIXTURE_URL_2="https://raw.githubusercontent.com/lirtual/session-actions/${FIXTURE_COMMIT}/.github/workflows/openlist.yml"
          PUBLIC_FIXTURE_SHA256_2="$(sha256sum "$RUNNER_TEMP/spec51-public-openlist-yml" | cut -d' ' -f1)"
          export PUBLIC_FIXTURE_SHA256_2
          docker run --rm --network "$net" --dns 1.1.1.1 \
            --sysctl net.ipv6.conf.all.disable_ipv6=1 \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --pids-limit 128 --memory 256m --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=32m \
            --env HOST_GATEWAY --env PUBLIC_FIXTURE_URL --env PUBLIC_FIXTURE_SHA256 \
            --env PUBLIC_FIXTURE_URL_2 --env PUBLIC_FIXTURE_SHA256_2 \
            --volume "$PWD/.github/scripts:/spec51:ro" \
            --volume "$PWD/tests/smoke_download_aria2_network.py:/smoke.py:ro" \
            "sa51-aria2-smoke:$GITHUB_RUN_ID" python /smoke.py
      - name: Check real aria2 DNS answer switching cannot reach private Runner service
        shell: bash
        run: |
          set -euo pipefail
          net="sa51-11111111"
          gateway="$(docker network inspect -f '{{(index .IPAM.Config 0).Gateway}}' "$net")"
          export HOST_GATEWAY="$gateway"
          docker run --rm --network "$net" --dns 127.0.0.1 \
            --sysctl net.ipv6.conf.all.disable_ipv6=1 \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --pids-limit 128 --memory 256m --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=32m \
            --env HOST_GATEWAY \
            --volume "$PWD/tests/smoke_download_dns_rebind.py:/smoke-dns.py:ro" \
            "sa51-aria2-smoke:$GITHUB_RUN_ID" python /smoke-dns.py
      - name: Remove isolated firewall rules, network and host fixture
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cleanup_failed=0
          bash .github/scripts/download-network.sh cleanup || cleanup_failed=1
          docker image rm -f "sa51-aria2-smoke:$GITHUB_RUN_ID" >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/spec51-public-readme" "$RUNNER_TEMP/spec51-public-openlist-yml"
          if test -s "$RUNNER_TEMP/host-fixture.pid"; then
            kill "$(cat "$RUNNER_TEMP/host-fixture.pid")" 2>/dev/null || true
          fi
          if test -s "$RUNNER_TEMP/udp-fixture.pid"; then
            kill "$(cat "$RUNNER_TEMP/udp-fixture.pid")" 2>/dev/null || true
          fi
          rm -rf "$RUNNER_TEMP/private-fixture" "$RUNNER_TEMP/host-fixture.pid" "$RUNNER_TEMP/host-fixture.log" \
            "$RUNNER_TEMP/udp-fixture.py" "$RUNNER_TEMP/udp-fixture.pid" "$RUNNER_TEMP/udp-fixture.log"
          if [[ "$cleanup_failed" != 0 ]]; then
            echo "DOWNLOAD_NETWORK_CLEANUP_FAILED" >&2
            exit 1
          fi

  smoke-windows-prerequisites:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test Python Session protocol on a real Windows Runner
        shell: pwsh
        run: |
          python -m py_compile .github/scripts/session_action.py
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Exercise Windows desktop preparation using the actual Session step
        shell: pwsh
        run: |
          $Source = Get-Content '.github/workflows/windows.yml' -Raw
          $Begin = $Source.IndexOf('      - name: Hide pre-existing Windows Terminal window')
          $End = $Source.IndexOf('      - name: Signed Ready', $Begin)
          if ($Begin -lt 0 -or $End -lt 0) { throw 'Windows desktop step not found' }
          $Section = $Source.Substring($Begin, $End - $Begin)
          $RunStart = $Section.IndexOf('        run: |')
          if ($RunStart -lt 0) { throw 'Windows desktop step must use a run block' }
          $Body = $Section.Substring($RunStart + '        run: |'.Length)
          $Script = (($Body -split '\r?\n') | ForEach-Object { $_ -replace '^          ', '' }) -join "`n"
          $Fixture = Join-Path $env:RUNNER_TEMP 'session-action-start'
          [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() | Set-Content $Fixture -NoNewline -Encoding ascii
          $ScriptPath = Join-Path $env:RUNNER_TEMP 'test-windows-desktop.ps1'
          Set-Content -Path $ScriptPath -Value $Script -Encoding utf8
          try {
            & $ScriptPath
          } finally {
            Remove-Item $ScriptPath, $Fixture -Force -ErrorAction SilentlyContinue
          }
      - name: Check OpenSSH and Windows host prerequisites without configuring access
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $errorsFound = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.github/scripts/windows-ssh.ps1').Path,
            [ref]$tokens, [ref]$errorsFound) | Out-Null
          if ($errorsFound.Count -ne 0) { throw 'Invalid Windows SSH configuration script' }
          $errorsFound = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.github/scripts/windows-rdp.ps1').Path,
            [ref]$tokens, [ref]$errorsFound) | Out-Null
          if ($errorsFound.Count -ne 0) { throw 'Invalid Windows RDP configuration script' }
          if (-not (Get-Service TermService -ErrorAction SilentlyContinue)) {
            throw 'Windows Remote Desktop Services unavailable'
          }
          if (-not (Get-Command Set-LocalUser -ErrorAction SilentlyContinue)) {
            throw 'Local password management unavailable'
          }
          $Identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $Account = Get-LocalUser -Name ([Environment]::UserName) -ErrorAction Stop
          if ($Account.SID.Value -ne $Identity.User.Value -or -not $Account.Enabled) {
            throw 'Default Windows Runner account is not a matching enabled local user'
          }
          if (-not ([Security.Principal.WindowsPrincipal]::new($Identity)).IsInRole(
              [Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw 'Default Windows Runner account is not an administrator'
          }
          if (-not (Get-Command New-NetFirewallRule -ErrorAction SilentlyContinue)) {
            throw 'Windows firewall tooling unavailable'
          }
          $sshCapability = Get-WindowsCapability -Online -Name 'OpenSSH.Server~~~~0.0.1.0'
          if (-not $sshCapability -or $sshCapability.State -notin @('Installed','NotPresent')) {
            throw 'OpenSSH Server capability unavailable'
          }
          Write-Output "Windows prerequisites passed; SSH was NOT enabled"

      - name: Verify native RDP disconnect handoff task registration
        shell: pwsh
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $errorsFound = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.github/scripts/windows-rdp-handoff.ps1').Path,
            [ref]$tokens, [ref]$errorsFound) | Out-Null
          if ($errorsFound.Count -ne 0) { throw 'Invalid Windows RDP handoff script' }
          try {
            & ./.github/scripts/windows-rdp-handoff.ps1 -Install
            [xml]$Task = Export-ScheduledTask -TaskName SessionActionsRdpConsoleHandoff
            $Ns = New-Object System.Xml.XmlNamespaceManager($Task.NameTable)
            $Ns.AddNamespace('t','http://schemas.microsoft.com/windows/2004/02/mit/task')
            $Trigger = $Task.SelectSingleNode('//t:SessionStateChangeTrigger', $Ns)
            $Principal = $Task.SelectSingleNode('//t:Principal', $Ns)
            if ($Trigger.StateChange -ne 'RemoteDisconnect' -or
                $Principal.LogonType -ne 'InteractiveToken' -or
                $Principal.RunLevel -ne 'HighestAvailable') {
              throw 'Unexpected RDP handoff task identity or trigger'
            }
            Write-Output 'Native RemoteDisconnect task registration verified; no RDP session modified'
          } finally {
            Unregister-ScheduledTask -TaskName SessionActionsRdpConsoleHandoff -Confirm:$false -ErrorAction SilentlyContinue
          }

      - name: Verify real UU Lite startup and private credential extraction
        shell: pwsh
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          $ErrorActionPreference = 'Stop'
          $Dir = Join-Path $env:LOCALAPPDATA 'session-actions'
          $File = Join-Path $Dir 'uu-remote.json'
          try {
            ./.github/scripts/windows-uu.ps1
            if (-not (Test-Path -LiteralPath $File -PathType Leaf)) {
              throw 'UU Lite private credential file missing'
            }
            $Access = Get-Acl -LiteralPath $Dir
            if (-not $Access.AreAccessRulesProtected) {
              throw 'UU Lite credential directory inherits unrelated access rules'
            }
            $Data = Get-Content -LiteralPath $File -Raw | ConvertFrom-Json
            if ($Data.device_id -notmatch '^[0-9]{9}$' -or
                $Data.verification_code -notmatch '^(?=.*[0-9])(?=.*[A-Za-z])[A-Za-z0-9]{8}$') {
              throw 'UU Lite extracted credential shape invalid'
            }
            if ($Data.PSObject.Properties.Name -contains 'share_url') {
              if ($Data.share_url -cnotmatch '^https://uuyc\.163\.com/invite/[0-9a-fA-F]{32}$') {
                throw 'UU Lite optional share URL failed strict origin and shape validation'
              }
              Write-Output 'UU_LITE_SHARE_URL_VALID=true'
            } else {
              Write-Output 'UU_LITE_SHARE_URL_UNAVAILABLE=true'
            }
            $FileTime = (Get-Item -LiteralPath $File).LastWriteTimeUtc
            pwsh -NoProfile -NonInteractive -File .github/scripts/windows-uu.ps1 -Refresh
            if ($LASTEXITCODE -ne 0) { throw 'UU Lite refresh failed' }
            $Refreshed = Get-Content -LiteralPath $File -Raw | ConvertFrom-Json
            if ($Refreshed.device_id -cne $Data.device_id -or
                $Refreshed.verification_code -cne $Data.verification_code -or
                $Refreshed.share_url -cne $Data.share_url -or
                (Get-Item -LiteralPath $File).LastWriteTimeUtc -ne $FileTime) {
              throw 'UU Lite refresh should preserve unchanged current code'
            }
            # Tray-hiding sets Process.MainWindowHandle to zero. Verify the
            # refresh path still finds the existing process-owned window.
            Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class UUCIShowWindow {
              [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr handle, int command);
          }
          '@
            $WindowProcess = Get-Process -Name GameViewerLite,GameViewerLiteInner,GameViewerLite-session -ErrorAction SilentlyContinue |
              Where-Object { $_.MainWindowHandle -ne [IntPtr]::Zero } | Select-Object -First 1
            if (-not $WindowProcess) { throw 'UU Lite visible window not found for tray-hidden test' }
            $Window = $WindowProcess.MainWindowHandle
            try {
              [void][UUCIShowWindow]::ShowWindow($Window, 0)
              Start-Sleep -Seconds 1
              # A previous failed refresh left a secret-free status file;
              # the next UIA refresh must recover usable credentials.
              [IO.File]::WriteAllText($File, '{"status":"unavailable","reason":"code_unavailable"}',
                [Text.UTF8Encoding]::new($false))
              pwsh -NoProfile -NonInteractive -File .github/scripts/windows-uu.ps1 -Refresh
              if ($LASTEXITCODE -ne 0) { throw 'UU Lite tray-hidden refresh failed' }
              $Hidden = Get-Content -LiteralPath $File -Raw | ConvertFrom-Json
              if ($Hidden.status -ne 'ready' -or
                  $Hidden.device_id -cne $Data.device_id -or
                  $Hidden.verification_code -cne $Data.verification_code) {
                throw 'UU Lite tray-hidden refresh captured incorrect credentials'
              }
            } finally {
              [void][UUCIShowWindow]::ShowWindow($Window, 9)
            }
            Write-Output 'UU_LITE_HIDDEN_WINDOW_REFRESH=true'
            # Missing upstream process is a safe failure: do not retain the
            # now unverified code, but provide a private diagnostic status.
            Get-Process -Name GameViewerLite,GameViewerLiteInner,GameViewerLite-session -ErrorAction SilentlyContinue |
              Stop-Process -Force -ErrorAction SilentlyContinue
            pwsh -NoProfile -NonInteractive -File .github/scripts/windows-uu.ps1 -Refresh 2>$null
            if ($LASTEXITCODE -eq 0) { throw 'UU Lite missing-process refresh unexpectedly succeeded' }
            $Unavailable = Get-Content -LiteralPath $File -Raw | ConvertFrom-Json
            if ($Unavailable.status -ne 'unavailable' -or
                $Unavailable.reason -ne 'process_missing' -or
                $Unavailable.PSObject.Properties.Name -contains 'verification_code') {
              throw 'UU Lite unavailable status failed closed'
            }
            # The preceding nonzero native exit was expected and asserted.
            $global:LASTEXITCODE = 0
            Write-Output 'UU_LITE_MISSING_PROCESS_STATUS=true'
            Write-Output 'UU_LITE_REFRESH_IDEMPOTENT=true'
            Write-Output 'UU_LITE_PRIVATE_CREDENTIAL_CAPTURE=true'
          } finally {
            Remove-Item -LiteralPath $Dir -Recurse -Force -ErrorAction SilentlyContinue
            Get-Process -Name GameViewerLite,GameViewerLiteInner,GameViewerLite-session -ErrorAction SilentlyContinue |
              Stop-Process -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'GameViewerLite-session.exe') -Force -ErrorAction SilentlyContinue
          }
