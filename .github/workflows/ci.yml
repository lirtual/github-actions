name: Static Workflow Contract
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/**
      - README.md
      - .github/scripts/**
      - tests/**
  pull_request:
    paths:
      - .github/workflows/**
      - README.md
      - .github/scripts/**
      - tests/**

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate GitHub Workflow syntax and expressions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/*.yml
      - name: Test shared GitHub OIDC and bounded Session protocol
        run: |
          python3 -m py_compile .github/scripts/session_action.py
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Verify pinned cloudflared supports protected Quick Tunnels
        shell: bash
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/cloudflared-otp"
          curl --fail --location --proto '=https' --retry 2 --silent --show-error --tlsv1.2 \
            'https://github.com/cloudflare/cloudflared/releases/download/2026.10.3/cloudflared-linux-amd64' \
            --output "$binary"
          printf '%s  %s\n' '053b80b0a23031a038fdbf3c073f59f82b8f1f152aa67971d7383ffafc0dbab0' "$binary" | sha256sum -c --status
          chmod 0700 "$binary"
          "$binary" --version | grep -Fq '2026.10.3'
          "$binary" tunnel --help 2>&1 | grep -F -- '--allowed-mail'
          # Fail closed when no explicit email recipient is configured.
          if SESSION_SERVICE=chrome SESSION_TUNNEL_ALLOWED_EMAIL='' bash .github/scripts/start-tunnel.sh; then
            echo 'Tunnel started without an allowed recipient' >&2
            exit 1
          fi
      - name: Check Ubuntu Runner password SSH prerequisites (read-only)
        shell: bash
        run: |
          bash -n .github/scripts/ubuntu-ssh.sh
          test "$(id -un)" = runner
          test -x /usr/sbin/sshd
          grep -Eq '^[[:space:]]*Include[[:space:]]+/etc/ssh/sshd_config.d/\*\.conf' /etc/ssh/sshd_config
      - name: Parse Windows SSH configuration script
        shell: pwsh
        run: |
          $tokens = $null
          $errorsFound = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.github/scripts/windows-ssh.ps1').Path, [ref]$tokens, [ref]$errorsFound) | Out-Null
          if ($errorsFound.Count -ne 0) { throw 'Invalid Windows SSH script syntax' }

  smoke-linux-services:
    # This executes only isolated, loopback-bound services. It intentionally
    # has NO repository/Tailnet secrets, OIDC, dispatch or Workflow MCP grants.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [chrome, code-server]
    steps:
      - name: Checkout without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify actual Session launch script shell syntax
        shell: bash
        run: bash -n .github/scripts/start-*.sh
      - name: Start the same local service script used by the Session
        shell: bash
        run: bash ".github/scripts/start-${{ matrix.service }}.sh"
      - name: Ensure no service listens on wildcard/public addresses
        shell: bash
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          case "$SERVICE" in
            chrome) PORT=3000 ;;
            code-server) PORT=8080 ;;
            openlist) PORT=5244 ;;
            *) exit 1 ;;
          esac
          ss -lnt | grep -E "127\\.0\\.0\\.1:${PORT}[[:space:]]"
          if ss -lnt | grep -E "(0\\.0\\.0\\.0|\\*|\\[::\\]):${PORT}[[:space:]]"; then
            echo "Service must not listen on a public interface" >&2
            exit 1
          fi
      - name: Assert password-free loopback GUI is ready for the protected Tunnel
        shell: bash
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          case "$SERVICE" in
            chrome) PORT=3000 ;;
            code-server) PORT=8080 ;;
            *) exit 1 ;;
          esac
          test "$(curl --silent --max-time 5 --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:$PORT/")" = 200
          # Verify no native login page/auth challenge survives.
          ! curl --silent --max-time 5 -D - -o /dev/null "http://127.0.0.1:$PORT/" | grep -Eiq '^www-authenticate:'

      - name: Remove transient local service
        if: always()
        shell: bash
        run: |
          if test -s "$RUNNER_TEMP/session-service.pid"; then
            kill "$(cat "$RUNNER_TEMP/session-service.pid")" 2>/dev/null || true
          fi
          docker rm --force session-openlist session-chrome >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/session-service-password"

  smoke-openlist-mysql:
    # Exercises the real startup script with a throwaway TLS MySQL Docker
    # container. No repo Secrets, Aiven credentials, or Workflow MCP grants.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate integration test script syntax
        shell: bash
        run: bash -n .github/scripts/test-openlist-mysql.sh
      - name: Test real OpenList startup and persistent TLS MySQL restart
        shell: bash
        run: bash .github/scripts/test-openlist-mysql.sh

  smoke-protected-quick-tunnel:
    # No Actions Secrets, Workflow MCP access or production services. The
    # external endpoint serves only a disposable, synthetic CI marker.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Start synthetic loopback origin
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tunnel-fixture"
          python3 - <<'PY'
          import secrets
          import os
          from pathlib import Path
          temp = Path(os.environ["RUNNER_TEMP"])
          value = "CI_ORIGIN_ONLY_" + secrets.token_hex(18)
          (temp / "tunnel-fixture" / "index.html").write_text(value)
          (temp / "tunnel-expected").write_text(value)
          PY
          python3 -m http.server 8080 --bind 127.0.0.1 --directory "$RUNNER_TEMP/tunnel-fixture" \
            > "$RUNNER_TEMP/tunnel-fixture.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/tunnel-fixture.pid"
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:8080/ >/dev/null; then
              exit 0
            fi
            if [[ "$attempt" -lt 5 ]]; then sleep 1; fi
          done
          echo 'Synthetic origin did not start' >&2
          exit 1
      - name: Launch email-OTP protected Quick Tunnel
        shell: bash
        env:
          SESSION_SERVICE: code-server
          SESSION_TUNNEL_ALLOWED_EMAIL: ${{ vars.SESSION_TUNNEL_ALLOWED_EMAIL }}
        run: bash .github/scripts/start-tunnel.sh
      - name: Assert unauthenticated HTTPS cannot reach synthetic origin
        shell: bash
        run: |
          set -euo pipefail
          url="$(cat "$RUNNER_TEMP/session-tunnel-url")"
          case "$url" in
            https://*.trycloudflare.com) ;;
            *) echo 'Unexpected Quick Tunnel hostname' >&2; exit 1 ;;
          esac
          marker="$(cat "$RUNNER_TEMP/tunnel-expected")"
          test "$(curl --fail --silent --max-time 2 http://127.0.0.1:8080/)" = "$marker"
          status="$(curl --silent --show-error --max-time 15 --output "$RUNNER_TEMP/tunnel-anonymous-body" \
            --dump-header "$RUNNER_TEMP/tunnel-anonymous-headers" --write-out '%{http_code}' "$url/")"
          test "$status" = 302
          grep -Eqi '^location: https://login\.trycloudflare\.com/authorize\?' "$RUNNER_TEMP/tunnel-anonymous-headers"
          if grep -Fq "$marker" "$RUNNER_TEMP/tunnel-anonymous-body"; then
            echo 'Protected Quick Tunnel exposed the private test origin anonymously' >&2
            exit 1
          fi
          # An unauthenticated unsafe method must be rejected by cloudflared,
          # not forwarded to the synthetic HTTP origin.
          post_status="$(curl --silent --show-error --max-time 15 --request POST \
            --output "$RUNNER_TEMP/tunnel-anonymous-body" --write-out '%{http_code}' "$url/")"
          test "$post_status" = 401
          if grep -Fq "$marker" "$RUNNER_TEMP/tunnel-anonymous-body"; then
            echo 'Protected Quick Tunnel exposed the origin on POST' >&2
            exit 1
          fi
          echo 'Anonymous GET redirected to OTP and POST denied'
      - name: Verify public OpenList Quick Tunnel uses native auth only
        shell: bash
        env:
          SESSION_SERVICE: openlist
          SESSION_TUNNEL_ALLOWED_EMAIL: ''
        run: |
          set -euo pipefail
          kill "$(cat "$RUNNER_TEMP/session-tunnel.pid")" 2>/dev/null || true
          mkdir -p "$RUNNER_TEMP/tunnel-fixture/api/public"
          printf '%s\n' '{"code":200,"message":"success","data":{"fixture":"openlist"}}' \
            > "$RUNNER_TEMP/tunnel-fixture/api/public/settings"
          python3 -m http.server 5244 --bind 127.0.0.1 --directory "$RUNNER_TEMP/tunnel-fixture" \
            > "$RUNNER_TEMP/openlist-fixture.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/openlist-fixture.pid"
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:5244/api/public/settings >/dev/null; then
              break
            fi
            if [[ "$attempt" -eq 5 ]]; then
              echo 'Synthetic OpenList origin did not start' >&2
              exit 1
            fi
            sleep 1
          done
          bash .github/scripts/start-tunnel.sh
          url="$(cat "$RUNNER_TEMP/session-tunnel-url")"
          marker="$(cat "$RUNNER_TEMP/tunnel-expected")"
          test "$(curl --fail --silent --max-time 15 "$url/")" = "$marker"
          test "$(curl --fail --silent --max-time 15 "$url/api/public/settings")" = \
            '{"code":200,"message":"success","data":{"fixture":"openlist"}}'
          echo 'Unauthenticated OpenList public routes reach the origin'
      - name: Close temporary Tunnel and delete fixture
        if: always()
        shell: bash
        run: |
          if test -s "$RUNNER_TEMP/session-tunnel.pid"; then
            kill "$(cat "$RUNNER_TEMP/session-tunnel.pid")" 2>/dev/null || true
          fi
          if test -s "$RUNNER_TEMP/tunnel-fixture.pid"; then
            kill "$(cat "$RUNNER_TEMP/tunnel-fixture.pid")" 2>/dev/null || true
          fi
          if test -s "$RUNNER_TEMP/openlist-fixture.pid"; then
            kill "$(cat "$RUNNER_TEMP/openlist-fixture.pid")" 2>/dev/null || true
          fi
          rm -f "$RUNNER_TEMP/session-tunnel-url" "$RUNNER_TEMP/session-tunnel.log" \
            "$RUNNER_TEMP/session-tunnel.pid" "$RUNNER_TEMP/cloudflared" \
            "$RUNNER_TEMP/tunnel-expected" "$RUNNER_TEMP/tunnel-anonymous-body" \
            "$RUNNER_TEMP/tunnel-anonymous-headers" "$RUNNER_TEMP/tunnel-fixture.pid" \
            "$RUNNER_TEMP/tunnel-fixture.log" "$RUNNER_TEMP/openlist-fixture.pid" \
            "$RUNNER_TEMP/openlist-fixture.log"
          rm -rf "$RUNNER_TEMP/tunnel-fixture"

  smoke-windows-prerequisites:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test Python Session protocol on a real Windows Runner
        shell: pwsh
        run: |
          python -m py_compile .github/scripts/session_action.py
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Exercise Windows desktop preparation using the actual Session step
        shell: pwsh
        run: |
          $Source = Get-Content '.github/workflows/windows.yml' -Raw
          $Begin = $Source.IndexOf('      - name: Hide pre-existing Windows Terminal window')
          $End = $Source.IndexOf('      - name: Signed Ready', $Begin)
          if ($Begin -lt 0 -or $End -lt 0) { throw 'Windows desktop step not found' }
          $Section = $Source.Substring($Begin, $End - $Begin)
          $RunStart = $Section.IndexOf('        run: |')
          if ($RunStart -lt 0) { throw 'Windows desktop step must use a run block' }
          $Body = $Section.Substring($RunStart + '        run: |'.Length)
          $Script = (($Body -split '\r?\n') | ForEach-Object { $_ -replace '^          ', '' }) -join "`n"
          $Fixture = Join-Path $env:RUNNER_TEMP 'session-action-start'
          [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() | Set-Content $Fixture -NoNewline -Encoding ascii
          $ScriptPath = Join-Path $env:RUNNER_TEMP 'test-windows-desktop.ps1'
          Set-Content -Path $ScriptPath -Value $Script -Encoding utf8
          try {
            & $ScriptPath
          } finally {
            Remove-Item $ScriptPath, $Fixture -Force -ErrorAction SilentlyContinue
          }
      - name: Check OpenSSH and Windows host prerequisites without configuring access
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $errorsFound = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.github/scripts/windows-ssh.ps1').Path,
            [ref]$tokens, [ref]$errorsFound) | Out-Null
          if ($errorsFound.Count -ne 0) { throw 'Invalid Windows SSH configuration script' }
          $errorsFound = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.github/scripts/windows-rdp.ps1').Path,
            [ref]$tokens, [ref]$errorsFound) | Out-Null
          if ($errorsFound.Count -ne 0) { throw 'Invalid Windows RDP configuration script' }
          if (-not (Get-Service TermService -ErrorAction SilentlyContinue)) {
            throw 'Windows Remote Desktop Services unavailable'
          }
          if (-not (Get-Command Set-LocalUser -ErrorAction SilentlyContinue)) {
            throw 'Local password management unavailable'
          }
          $Identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $Account = Get-LocalUser -Name ([Environment]::UserName) -ErrorAction Stop
          if ($Account.SID.Value -ne $Identity.User.Value -or -not $Account.Enabled) {
            throw 'Default Windows Runner account is not a matching enabled local user'
          }
          if (-not ([Security.Principal.WindowsPrincipal]::new($Identity)).IsInRole(
              [Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw 'Default Windows Runner account is not an administrator'
          }
          if (-not (Get-Command New-NetFirewallRule -ErrorAction SilentlyContinue)) {
            throw 'Windows firewall tooling unavailable'
          }
          $sshCapability = Get-WindowsCapability -Online -Name 'OpenSSH.Server~~~~0.0.1.0'
          if (-not $sshCapability -or $sshCapability.State -notin @('Installed','NotPresent')) {
            throw 'OpenSSH Server capability unavailable'
          }
          Write-Output "Windows prerequisites passed; SSH was NOT enabled"

      - name: Probe officially signed UU Lite on disposable Windows Runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Executable = Join-Path $env:RUNNER_TEMP 'GameViewerLite-session-probe.exe'
          try {
            # Resolve the current Lite binary via NetEase's own download channel.
            $Channel = Invoke-WebRequest -UseBasicParsing -TimeoutSec 20 'https://adl.netease.com/d/g/uuremote/c/greengw/js'
            $Match = [regex]::Match($Channel.Content, 'var\s+pc_link\s*=\s*"([^"]+)"')
            if (-not $Match.Success) { throw 'Official UU Lite channel has no Windows binary' }
            $Url = [uri]$Match.Groups[1].Value
            if ($Url.Scheme -ne 'https' -or $Url.Host -notmatch '^a[0-9]+\.gdl\.netease\.com$' -or
                [IO.Path]::GetFileName($Url.AbsolutePath) -notmatch '^GameViewerLite_[a-zA-Z0-9_.-]+\.exe$') {
              throw 'Unexpected UU Lite download origin or filename'
            }
            & curl.exe --fail --location --silent --show-error --retry 2 --retry-all-errors --retry-delay 2 --max-time 90 --proto '=https' --proto-redir '=https' --output $Executable $Url.AbsoluteUri
            if ($LASTEXITCODE -ne 0) { throw 'UU Lite official download failed after bounded retries' }
            $Signature = Get-AuthenticodeSignature -FilePath $Executable
            if ($Signature.Status -ne 'Valid' -or
                $Signature.SignerCertificate.Subject -notlike '*NetEase (Hangzhou) Network Co., Ltd*') {
              throw 'Downloaded UU Lite did not pass NetEase Authenticode validation'
            }
            Write-Output 'UU_LITE_SIGNED=true'
            Start-Process -FilePath $Executable | Out-Null
            Start-Sleep -Seconds 20
            $Running = @(Get-Process -Name GameViewerLite,GameViewerLiteInner,GameViewerLite-session-probe,GameViewer -ErrorAction SilentlyContinue)
            if ($Running.Count -eq 0) { throw 'UU Lite did not stay running on Windows Runner' }
            Write-Output 'UU_LITE_RUNNING=true'
            # Only use supported CLI; never expose a device ID/code in public CI logs.
            $CliPaths = @(
              @($Running | Where-Object { $_.Path } | ForEach-Object { Join-Path (Split-Path $_.Path) 'uuyc-cli.exe' }),
              (Join-Path $env:RUNNER_TEMP 'uuyc-cli.exe'),
              'C:\Program Files\Netease\GameViewer\bin\uuyc-cli.exe',
              'C:\Program Files (x86)\Netease\GameViewer\bin\uuyc-cli.exe'
            )
            $Cli = $CliPaths | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
            if ($Cli) {
              $DeviceId = (& $Cli -d 2>&1 | Out-String).Trim()
              if ($LASTEXITCODE -ne 0 -or $DeviceId.Length -lt 4 -or $DeviceId.Length -gt 120) {
                throw 'UU Lite device ID is not available without interaction'
              }
              Write-Output 'UU_LITE_DEVICE_ID_AVAILABLE=true'
            } else {
              Write-Output 'UU_LITE_CLI_PRESENT=false'
              # Read only automation metadata. Never log actual UI element names,
              # text, device IDs, or verification codes on a public CI job.
              $Windows = @($Running | Where-Object { $_.MainWindowHandle -ne [IntPtr]::Zero })
              Write-Output ("UU_LITE_WINDOW_AVAILABLE=" + ($Windows.Count -gt 0).ToString().ToLowerInvariant())
              try {
                Add-Type -AssemblyName UIAutomationClient,UIAutomationTypes -ErrorAction Stop
                $Controls = 0
                $IdLabel = $false
                $CodeLabel = $false
                $CopyLabel = $false
                $ReadableValues = 0
                $TextPatternCount = 0
                $Shapes = @()
                $IdCandidates = @()
                $CodeCandidates = @()
                foreach ($Process in $Windows) {
                  $Root = [System.Windows.Automation.AutomationElement]::FromHandle($Process.MainWindowHandle)
                  if (-not $Root) { continue }
                  $Items = $Root.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition)
                  $Controls += $Items.Count
                  foreach ($Item in $Items) {
                    $Name = [string]$Item.Current.Name
                    if ($Name -match '(?i)设备.{0,3}(ID|编号)|device.{0,3}id') { $IdLabel = $true }
                    if ($Name -match '验证码|verification code') { $CodeLabel = $true }
                    if ($Name -match '复制|copy') { $CopyLabel = $true }
                    $Type = $Item.Current.ControlType.ProgrammaticName -replace '^ControlType\.', ''
                    $Kind = if ($Name -match '(?i)设备.{0,3}(ID|编号)|device.{0,3}id') { 'ID' } elseif ($Name -match '验证码|verification code') { 'CODE' } else { 'OTHER' }
                    $Value = $null
                    $VisibleText = $Name
                    $Sources = 'N'
                    if ($Item.TryGetCurrentPattern([System.Windows.Automation.ValuePattern]::Pattern, [ref]$Value)) {
                      $ReadableValues++
                      $VisibleText += ' ' + [string]$Value.Current.Value
                      $Sources += 'V'
                    }
                    $TextPattern = $null
                    if ($Item.TryGetCurrentPattern([System.Windows.Automation.TextPattern]::Pattern, [ref]$TextPattern)) {
                      $TextPatternCount++
                      $VisibleText += ' ' + [string]$TextPattern.DocumentRange.GetText(1024)
                      $Sources += 'T'
                    }
                    # Never log connection IDs/codes, accessible element names or
                    # raw values. Classify only types and aggregate character counts.
                    $Shape = 'n' + $VisibleText.Length + 'd' + ([regex]::Matches($VisibleText, '\p{Nd}')).Count +
                      'a' + ([regex]::Matches($VisibleText, '[a-zA-Z]')).Count +
                      'm' + ([regex]::Matches($VisibleText, '[*●•]')).Count
                    $Invoke = $null
                    $CanInvoke = $Item.TryGetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern, [ref]$Invoke)
                    $Shapes += ($Type + ':' + $Kind + ':' + $Shape + ':' + $Sources + ':invoke' + $CanInvoke.ToString().ToLowerInvariant())
                    if ($Type -eq 'Text') {
                      $Normalized = [regex]::Replace($Name.Trim(), '[\s\-–—]', '')
                      if ($Normalized -match '^[0-9]{9}
                  }
                }
                Write-Output ("UU_LITE_UIA_CONTROL_COUNT=" + $Controls)
                Write-Output ("UU_LITE_UIA_ID_LABEL=" + $IdLabel.ToString().ToLowerInvariant())
                Write-Output ("UU_LITE_UIA_CODE_LABEL=" + $CodeLabel.ToString().ToLowerInvariant())
                Write-Output ("UU_LITE_UIA_COPY_LABEL=" + $CopyLabel.ToString().ToLowerInvariant())
                Write-Output ("UU_LITE_UIA_VALUE_CONTROLS=" + $ReadableValues)
                Write-Output ("UU_LITE_UIA_TEXT_CONTROLS=" + $TextPatternCount)
                Write-Output ("UU_LITE_UIA_SANITIZED_SHAPES=" + ($Shapes -join ','))
                $Unique = $IdCandidates.Count -eq 1 -and $CodeCandidates.Count -eq 1 -and $IdLabel -and $CodeLabel
                Write-Output ("UU_LITE_CREDENTIAL_PATTERN_UNIQUE=" + $Unique.ToString().ToLowerInvariant())
                if ($Unique) {
                  Start-Sleep -Seconds 2
                  $IdReadback = [regex]::Replace(([string]$IdCandidates[0].Element.Current.Name).Trim(), '[\s\-–—]', '')
                  $CodeReadback = [regex]::Replace(([string]$CodeCandidates[0].Element.Current.Name).Trim(), '[\s\-–—]', '')
                  $Stable = $IdReadback -ceq $IdCandidates[0].Value -and $CodeReadback -ceq $CodeCandidates[0].Value
                  Write-Output ("UU_LITE_CREDENTIAL_TEXT_STABLE=" + $Stable.ToString().ToLowerInvariant())
                }
              } catch {
                Write-Output 'UU_LITE_UIA_INSPECTION=unavailable'
              }
              Write-Output 'UU_LITE_UNATTENDED_CREDENTIALS_VERIFIED=false'
            }
          } finally {
            Get-Process -Name GameViewerLite,GameViewerLiteInner,GameViewerLite-session-probe,GameViewer,GameViewerServer,GameViewerService,uuyc-mux -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $Executable -Force -ErrorAction SilentlyContinue
          }
) {
                        $IdCandidates += @{ Element = $Item; Value = $Normalized }
                      }
                      if ($Normalized -match '^(?=.*[0-9])(?=.*[A-Za-z])[A-Za-z0-9]{8}
                  }
                }
                Write-Output ("UU_LITE_UIA_CONTROL_COUNT=" + $Controls)
                Write-Output ("UU_LITE_UIA_ID_LABEL=" + $IdLabel.ToString().ToLowerInvariant())
                Write-Output ("UU_LITE_UIA_CODE_LABEL=" + $CodeLabel.ToString().ToLowerInvariant())
                Write-Output ("UU_LITE_UIA_COPY_LABEL=" + $CopyLabel.ToString().ToLowerInvariant())
                Write-Output ("UU_LITE_UIA_VALUE_CONTROLS=" + $ReadableValues)
                Write-Output ("UU_LITE_UIA_TEXT_CONTROLS=" + $TextPatternCount)
                Write-Output ("UU_LITE_UIA_SANITIZED_SHAPES=" + ($Shapes -join ','))
              } catch {
                Write-Output 'UU_LITE_UIA_INSPECTION=unavailable'
              }
              Write-Output 'UU_LITE_UNATTENDED_CREDENTIALS_VERIFIED=false'
            }
          } finally {
            Get-Process -Name GameViewerLite,GameViewerLiteInner,GameViewerLite-session-probe,GameViewer,GameViewerServer,GameViewerService,uuyc-mux -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $Executable -Force -ErrorAction SilentlyContinue
          }
) {
                        $CodeCandidates += @{ Element = $Item; Value = $Normalized }
                      }
                    }
                  }
                }
                Write-Output ("UU_LITE_UIA_CONTROL_COUNT=" + $Controls)
                Write-Output ("UU_LITE_UIA_ID_LABEL=" + $IdLabel.ToString().ToLowerInvariant())
                Write-Output ("UU_LITE_UIA_CODE_LABEL=" + $CodeLabel.ToString().ToLowerInvariant())
                Write-Output ("UU_LITE_UIA_COPY_LABEL=" + $CopyLabel.ToString().ToLowerInvariant())
                Write-Output ("UU_LITE_UIA_VALUE_CONTROLS=" + $ReadableValues)
                Write-Output ("UU_LITE_UIA_TEXT_CONTROLS=" + $TextPatternCount)
                Write-Output ("UU_LITE_UIA_SANITIZED_SHAPES=" + ($Shapes -join ','))
              } catch {
                Write-Output 'UU_LITE_UIA_INSPECTION=unavailable'
              }
              Write-Output 'UU_LITE_UNATTENDED_CREDENTIALS_VERIFIED=false'
            }
          } finally {
            Get-Process -Name GameViewerLite,GameViewerLiteInner,GameViewerLite-session-probe,GameViewer,GameViewerServer,GameViewerService,uuyc-mux -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $Executable -Force -ErrorAction SilentlyContinue
          }
