name: windows
on:
  workflow_dispatch:
    inputs:
      attempt_id:
        description: Server-owned logical Attempt
        type: string
        required: true
      dispatch_id:
        description: Server-owned dispatch correlation
        type: string
        required: true
      capability_id:
        description: Server-owned capability
        type: string
        required: true
      duration_minutes:
        description: Session lifetime (1-330 minutes)
        type: number
        default: 330
        required: false
env:
  WORKFLOW_ACTION_TYPE: session
permissions:
  contents: read
  id-token: write
jobs:
  session:
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      ATTEMPT_ID: ${{ inputs.attempt_id }}
      DISPATCH_ID: ${{ inputs.dispatch_id }}
      CAPABILITY_ID: ${{ inputs.capability_id }}
      WORKFLOW_ACTION_CLAIM_URL: ${{ vars.WORKFLOW_ACTION_CLAIM_URL }}
      WORKFLOW_ACTION_OIDC_AUDIENCE: ${{ vars.WORKFLOW_ACTION_OIDC_AUDIENCE }}
      DURATION_MINUTES: ${{ inputs.duration_minutes }}
    steps:
      - name: Capture job lifetime before checkout
        shell: pwsh
        run: |
          [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() | Set-Content -Path (Join-Path $env:RUNNER_TEMP 'session-action-start') -NoNewline -Encoding ascii
      - name: Checkout pinned dispatched revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Record bounded lifetime
        shell: pwsh
        run: python .github/scripts/session_action.py start
      - name: Claim approved physical GitHub Run
        shell: pwsh
        run: python .github/scripts/session_action.py claim
      - name: Suppress Tailscale first-run onboarding on the disposable Runner
        shell: pwsh
        run: |
          $Policy = 'HKLM:\SOFTWARE\Policies\Tailscale'
          New-Item -Path $Policy -Force | Out-Null
          New-ItemProperty -Path $Policy -Name OnboardingFlow -PropertyType String -Value hide -Force | Out-Null
      - name: Join ephemeral Tailnet
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:session-actions
          hostname: sa-${{ github.run_id }}-a${{ github.run_attempt }}
      - name: Configure Tailnet-only password SSH for the Windows Runner
        shell: pwsh
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          SESSION_SYSTEM_PASSWORD: ${{ secrets.SESSION_SYSTEM_PASSWORD }}
        run: ./.github/scripts/windows-ssh.ps1
      - name: Enable Windows RDP using the existing Runner account
        shell: pwsh
        run: ./.github/scripts/windows-rdp.ps1
      - name: Signed Ready after private SSH and RDP are listening
        shell: pwsh
        run: python .github/scripts/session_action.py ready
      - name: Hold until selected lifetime or GitHub cancellation
        shell: pwsh
        run: python .github/scripts/session_action.py hold
      - name: Stop SSH and remove Tailnet firewall access
        if: always()
        shell: pwsh
        run: |
          Stop-Service sshd -ErrorAction SilentlyContinue
          Remove-NetFirewallRule -Name SessionActionsTailscaleSSH -ErrorAction SilentlyContinue
          Remove-NetFirewallRule -Name SessionActionsTailscaleRDP -ErrorAction SilentlyContinue
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 1 -ErrorAction SilentlyContinue
