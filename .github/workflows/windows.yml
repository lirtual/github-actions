name: Windows Session
on:
  workflow_dispatch:
    inputs:
      attempt_id:
        description: Server-owned logical Attempt
        type: string
        required: true
      dispatch_id:
        description: Server-owned dispatch correlation
        type: string
        required: true
      capability_id:
        description: Server-owned capability
        type: string
        required: true
      duration_minutes:
        description: Session lifetime (1-330 minutes)
        type: number
        default: 330
        required: false
env:
  WORKFLOW_ACTION_TYPE: session
permissions:
  contents: read
  id-token: write
jobs:
  session:
    runs-on: windows-latest
    timeout-minutes: 330
    env:
      ATTEMPT_ID: ${{ inputs.attempt_id }}
      DISPATCH_ID: ${{ inputs.dispatch_id }}
      CAPABILITY_ID: ${{ inputs.capability_id }}
      WORKFLOW_ACTION_CLAIM_URL: ${{ vars.WORKFLOW_ACTION_CLAIM_URL }}
      WORKFLOW_ACTION_OIDC_AUDIENCE: ${{ vars.WORKFLOW_ACTION_OIDC_AUDIENCE }}
      DURATION_MINUTES: ${{ inputs.duration_minutes }}
    steps:
      - name: Checkout pinned dispatched revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Record bounded lifetime
        shell: pwsh
        run: python .github/scripts/session_action.py start
      - name: Claim approved physical GitHub Run
        shell: pwsh
        run: python .github/scripts/session_action.py claim
      - name: Join ephemeral Tailnet
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:session-actions
          hostname: sa-${{ github.run_id }}-a${{ github.run_attempt }}
      - name: Configure restricted SSH-only Windows Session
        shell: pwsh
        env:
          SESSION_SSH_PUBLIC_KEY: ${{ vars.SESSION_SSH_PUBLIC_KEY }}
        run: ./.github/scripts/windows-ssh.ps1
      - name: Signed Ready after private SSH is listening
        shell: pwsh
        run: python .github/scripts/session_action.py ready
      - name: Hold until selected lifetime or GitHub cancellation
        shell: pwsh
        run: python .github/scripts/session_action.py hold
      - name: Classify bounded SSH authentication diagnostics
        if: always()
        shell: pwsh
        run: |
          $folder = Join-Path $env:ProgramData 'ssh\logs'
          $logs = @()
          if (Test-Path $folder) {
            foreach ($file in @(Get-ChildItem $folder -Filter 'sshd*.log' -ErrorAction SilentlyContinue | Select-Object -First 2)) {
              $logs += @(Get-Content $file.FullName -Tail 500 -ErrorAction SilentlyContinue)
            }
          }
          $signals = [ordered]@{
            key_file_access_denied = '(?i)(authorized_keys.*(permission denied|access denied|cannot open)|could not open .*authorized)'
            ownership_rejected = '(?i)(bad ownership|bad modes|authentication refused)'
            authorized_key_matched = '(?i)(matching key found|accepted key)'
            pubkey_rejected = '(?i)(failed publickey|userauth_pubkey.*failure|key not found)'
            user_rejected = '(?i)(invalid user|not allowed because)'
            user_invalid = '(?i)(invalid user|unable to resolve user)'
            user_not_allowlisted = '(?i)(not allowed because not listed in AllowUsers)'
            user_account_locked = '(?i)(not allowed because.*locked)'
            user_account_disabled = '(?i)(not allowed because.*disabled)'
            user_group_denied = '(?i)(not allowed because.*group)'
            user_denied_or_expired = '(?i)(not allowed because.*(denied|expired|DenyUsers))'
          }
          Write-Output ("SSH diagnostic log lines available: " + $logs.Count)
          foreach ($label in $signals.Keys) {
            $hits = @($logs | Where-Object { $_ -match $signals[$label] }).Count
            Write-Output ("SSH diagnostic " + $label + ": " + $hits)
          }
      - name: Clean up restricted SSH account and firewall
        if: always()
        shell: pwsh
        run: |
          Stop-Service sshd -ErrorAction SilentlyContinue
          Remove-NetFirewallRule -Name SessionActionsTailscaleSSH -ErrorAction SilentlyContinue
          Remove-LocalUser -Name sessionuser -ErrorAction SilentlyContinue
