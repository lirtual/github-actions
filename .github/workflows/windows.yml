name: windows
on:
  workflow_dispatch:
    inputs:
      attempt_id:
        description: Server-owned logical Attempt
        type: string
        required: true
      dispatch_id:
        description: Server-owned dispatch correlation
        type: string
        required: true
      capability_id:
        description: Server-owned capability
        type: string
        required: true
      duration_minutes:
        description: Session lifetime (1-300 minutes)
        type: number
        default: 300
        required: false
      session_mode:
        description: Fixed or temporary Tailnet hostname
        type: choice
        options:
          - fixed
          - temporary
        default: fixed
        required: false
      duration_mode:
        description: Explicit minutes or repository session default
        type: choice
        options:
          - explicit
          - repository
        default: explicit
        required: false

env:
  WORKFLOW_ACTION_TYPE: session
permissions:
  contents: read
  id-token: write
jobs:
  session:
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      ATTEMPT_ID: ${{ inputs.attempt_id }}
      DISPATCH_ID: ${{ inputs.dispatch_id }}
      CAPABILITY_ID: ${{ inputs.capability_id }}
      WORKFLOW_ACTION_CLAIM_URL: ${{ vars.WORKFLOW_ACTION_CLAIM_URL }}
      WORKFLOW_ACTION_OIDC_AUDIENCE: ${{ vars.WORKFLOW_ACTION_OIDC_AUDIENCE }}
      DURATION_MINUTES: ${{ inputs.duration_mode == 'repository' && (vars.SESSION_DURATION_MINUTES || '300') || inputs.duration_minutes }}
      SESSION_TAILSCALE_HOSTNAME: ${{ inputs.session_mode == 'fixed' && 'session-windows' || format('sa-{0}-a{1}', github.run_id, github.run_attempt) }}
    steps:
      - name: Capture job lifetime before checkout
        shell: pwsh
        run: |
          [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() | Set-Content -Path (Join-Path $env:RUNNER_TEMP 'session-action-start') -NoNewline -Encoding ascii
      - name: Checkout pinned dispatched revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Record bounded lifetime
        shell: pwsh
        run: python .github/scripts/session_action.py start
      - name: Claim approved physical GitHub Run
        shell: pwsh
        run: python .github/scripts/session_action.py claim
      - name: Suppress Tailscale first-run onboarding on the disposable Runner
        shell: pwsh
        run: |
          $Policy = 'HKLM:\SOFTWARE\Policies\Tailscale'
          New-Item -Path $Policy -Force | Out-Null
          New-ItemProperty -Path $Policy -Name OnboardingFlow -PropertyType String -Value hide -Force | Out-Null
      - name: Join ephemeral Tailnet
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:session-actions
          hostname: ${{ env.SESSION_TAILSCALE_HOSTNAME }}
      - name: Verify allocated Tailnet name before privileged access
        shell: pwsh
        run: python .github/scripts/verify-tailnet-name.py
      - name: Configure Tailnet-only password SSH for the Windows Runner
        shell: pwsh
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          SESSION_SYSTEM_PASSWORD: ${{ secrets.SESSION_SYSTEM_PASSWORD }}
        run: ./.github/scripts/windows-ssh.ps1
      - name: Enable Windows RDP using the existing Runner account
        shell: pwsh
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: ./.github/scripts/windows-rdp.ps1
      - name: Start optional UU Lite remote access
        shell: pwsh
        continue-on-error: true
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: ./.github/scripts/windows-uu.ps1
      - name: Hide pre-existing Windows Terminal window without stopping the Runner
        shell: pwsh
        run: |
          $StartedAt = [DateTimeOffset]::FromUnixTimeSeconds(
            [long](Get-Content (Join-Path $env:RUNNER_TEMP 'session-action-start') -Raw).Trim()).UtcDateTime
          $SessionId = (Get-Process -Id $PID).SessionId
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class SessionWindow {
              [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr hWnd, int nCmdShow);
              [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr hWnd);
          }
          '@
          Get-Process -Name WindowsTerminal -ErrorAction SilentlyContinue | Where-Object {
            $_.SessionId -eq $SessionId -and
            $_.StartTime.ToUniversalTime() -lt $StartedAt -and
            $_.MainWindowHandle -ne [IntPtr]::Zero
          } | ForEach-Object {
            [void][SessionWindow]::ShowWindow($_.MainWindowHandle, 0)
            if ([SessionWindow]::IsWindowVisible($_.MainWindowHandle)) {
              throw 'Pre-existing Windows Terminal window could not be hidden'
            }
            Write-Output 'Pre-existing Windows Terminal window hidden without stopping its process'
          }
      - name: Signed Ready after private SSH and RDP are listening
        shell: pwsh
        run: python .github/scripts/session_action.py ready
      - name: Hold until selected lifetime or GitHub cancellation
        shell: pwsh
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: python .github/scripts/session_action.py hold
      - name: Stop SSH and remove Tailnet firewall access
        if: always()
        shell: pwsh
        run: |
          Unregister-ScheduledTask -TaskName SessionActionsRdpConsoleHandoff -Confirm:$false -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $env:LOCALAPPDATA 'session-actions\uu-remote.json') -Force -ErrorAction SilentlyContinue
          Get-Process -Name GameViewerLite,GameViewerLiteInner,GameViewerLite-session -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'GameViewerLite-session.exe') -Force -ErrorAction SilentlyContinue
          Stop-Service sshd -ErrorAction SilentlyContinue
          Remove-NetFirewallRule -Name SessionActionsTailscaleSSH -ErrorAction SilentlyContinue
          Remove-NetFirewallRule -Name SessionActionsTailscaleRDP -ErrorAction SilentlyContinue
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 1 -ErrorAction SilentlyContinue
