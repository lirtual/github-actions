name: Verify Workflow Action
on:
  workflow_dispatch:
    inputs:
      attempt_id:
        description: Server-owned logical attempt ID
        type: string
        required: true
      dispatch_id:
        description: Server-owned dispatch correlation ID
        type: string
        required: true
      capability_id:
        description: Server-owned execution capability
        type: string
        required: true
      outcome:
        description: Verify the real GitHub task success or failure path
        type: choice
        required: true
        options: [success, failure]
        default: success

# An explicitly approved Task; this is not a general command runner.
env:
  WORKFLOW_ACTION_TYPE: task

# No checkout, repository contents, GitHub token use, or application secrets.
# GitHub OIDC is requested exclusively to claim a D1-registered Attempt.
permissions:
  contents: none
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Claim approved physical Run before any task work
        shell: bash
        env:
          ATTEMPT_ID: ${{ inputs.attempt_id }}
          DISPATCH_ID: ${{ inputs.dispatch_id }}
          CAPABILITY_ID: ${{ inputs.capability_id }}
          CLAIM_URL: ${{ vars.WORKFLOW_ACTION_CLAIM_URL }}
          OIDC_AUDIENCE: ${{ vars.WORKFLOW_ACTION_OIDC_AUDIENCE }}
        run: |
          python3 - <<'PY'
          import json
          import http.client
          import os
          import re
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          uuid = re.compile(r"^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$", re.I)
          attempt = os.environ.get("ATTEMPT_ID", "")
          dispatch = os.environ.get("DISPATCH_ID", "")
          claim_url = os.environ.get("CLAIM_URL", "")
          audience = os.environ.get("OIDC_AUDIENCE", "")
          parsed = urllib.parse.urlsplit(claim_url)
          if (
              not uuid.fullmatch(attempt)
              or not uuid.fullmatch(dispatch)
              or os.environ.get("CAPABILITY_ID") != "github.action"
              or not re.fullmatch(r"workflow-github-[a-z0-9:-]{4,120}", audience)
              or parsed.scheme != "https"
              or not parsed.netloc
              or parsed.username is not None
              or parsed.password is not None
              or parsed.path != "/github/action/claim"
              or parsed.query
              or parsed.fragment
          ):
              sys.exit("Action claim configuration or server-owned identity invalid")

          # GitHub's OIDC request credentials are short-lived and never logged.
          endpoint = os.environ.get("ACTIONS_ID_TOKEN_REQUEST_URL", "")
          authorization = os.environ.get("ACTIONS_ID_TOKEN_REQUEST_TOKEN", "")
          if not endpoint.startswith("https://") or not authorization:
              sys.exit("GitHub OIDC identity unavailable")
          separator = "&" if "?" in endpoint else "?"
          token_url = endpoint + separator + urllib.parse.urlencode({"audience": audience})
          # Do not forward Bearer credentials or accept a redirected fake 200.
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect())
          phase = "oidc_request"
          try:
              # The GitHub Job may start before the dispatch ACK is stored in
              # D1, or its first successful Claim HTTP response may be lost.
              # A 503 may be retried with a fresh OIDC JWT; 403 fails closed.
              for retry in range(12):
                  request = urllib.request.Request(
                      token_url, headers={"Authorization": "Bearer " + authorization}
                  )
                  with opener.open(request, timeout=15) as response:
                      issued = json.load(response)
                  phase = "oidc_response"
                  jwt = issued.get("value")
                  if not isinstance(jwt, str) or not jwt:
                      raise ValueError("missing signed token")
                  request = urllib.request.Request(
                      claim_url,
                      data=json.dumps({"attemptId": attempt}).encode("utf-8"),
                      headers={
                          "Authorization": "Bearer " + jwt,
                          "Content-Type": "application/json",
                      },
                      method="POST",
                  )
                  phase = "claim_request"
                  try:
                      with opener.open(request, timeout=20) as response:
                          phase = "claim_response"
                          accepted = response.status == 200 and json.load(response) in (
                              {"result": "claimed"}, {"result": "already_claimed"}
                          )
                  except urllib.error.HTTPError as failure:
                      code = failure.code
                      failure.close()
                      if code != 503:
                          raise
                  except (OSError, http.client.IncompleteRead, json.JSONDecodeError):
                      # First 200 may have committed Claim before its reply broke.
                      # Only the same signed physical owner can replay safely.
                      pass
                  else:
                      if not accepted:
                          raise ValueError("claim denied")
                      break
                  if retry == 11:
                      raise ValueError("claim unavailable")
                  time.sleep(5)
          except urllib.error.HTTPError as failure:
              # Report only the safe protocol phase and numeric HTTP code.
              # Never print the destination URL, response, JWT or credential.
              status = failure.code
              failure.close()
              sys.exit("GitHub Action Claim " + phase + " HTTP " + str(status))
          except Exception as failure:
              # Exception class is safe; repr/str may contain token-bearing URLs.
              sys.exit("GitHub Action Claim " + phase + " " + type(failure).__name__)
          print("GitHub physical Run ownership verified")
          PY

      - name: Execute bounded verification Task
        shell: bash
        env:
          REQUESTED_OUTCOME: ${{ inputs.outcome }}
        run: |
          case "$REQUESTED_OUTCOME" in
            success)
              echo "Verified GitHub Task completed successfully"
              ;;
            failure)
              echo "Verified GitHub Task exercised the failure path"
              exit 1
              ;;
            *)
              echo "Unsupported Task outcome" >&2
              exit 1
              ;;
          esac

      - name: Submit small signed Task result after successful work
        if: success()
        # This is optional metadata; a missing callback must never redefine
        # the already-completed verification Task's native result.
        continue-on-error: true
        shell: bash
        env:
          ATTEMPT_ID: ${{ inputs.attempt_id }}
          CLAIM_URL: ${{ vars.WORKFLOW_ACTION_CLAIM_URL }}
          OIDC_AUDIENCE: ${{ vars.WORKFLOW_ACTION_OIDC_AUDIENCE }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          claim = urllib.parse.urlsplit(os.getenv("CLAIM_URL", ""))
          audience = os.getenv("OIDC_AUDIENCE", "")
          attempt = os.getenv("ATTEMPT_ID", "")
          endpoint = os.getenv("ACTIONS_ID_TOKEN_REQUEST_URL", "")
          secret = os.getenv("ACTIONS_ID_TOKEN_REQUEST_TOKEN", "")
          if (claim.scheme != "https" or not claim.hostname or claim.username or claim.password
              or claim.path != "/github/action/claim" or claim.query or claim.fragment
              or not endpoint.startswith("https://") or not secret
              or not audience.startswith("workflow-github-")):
              sys.exit("Task result configuration invalid")

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect())
          separator = "&" if "?" in endpoint else "?"
          try:
              request = urllib.request.Request(
                  endpoint + separator + urllib.parse.urlencode({"audience": audience}),
                  headers={"Authorization": "Bearer " + secret})
              with opener.open(request, timeout=15) as response:
                  jwt = json.load(response)["value"]
              payload = json.dumps({
                  "attemptId": attempt,
                  "result": {"verification": "passed", "outcome": "success"}
              }).encode("utf-8")
              request = urllib.request.Request(
                  os.environ["CLAIM_URL"][:-len("/claim")] + "/result",
                  data=payload, method="POST",
                  headers={"Authorization": "Bearer " + jwt,
                           "Content-Type": "application/json"})
              with opener.open(request, timeout=20) as response:
                  if response.status != 200 or json.load(response).get("result") not in (
                      "recorded", "already_recorded"):
                      raise ValueError("Task result refused")
          except urllib.error.HTTPError as failure:
              status = failure.code
              failure.close()
              sys.exit("Task result HTTP " + str(status))
          except Exception:
              sys.exit("Task result unavailable")
          print("Signed bounded Task result submitted")
          PY
