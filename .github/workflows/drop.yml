name: drop
on:
  workflow_dispatch:
    inputs:
      attempt_id:
        description: Server-owned physical Attempt ID
        type: string
        required: true
      dispatch_id:
        description: Server-owned dispatch correlation ID
        type: string
        required: true
      capability_id:
        description: Server-owned execution capability
        type: string
        required: true
      drop_part_0:
        description: Encrypted selected-file envelope (part 0)
        type: string
        required: true
      drop_part_1:
        description: Encrypted selected-file envelope (part 1)
        type: string
        required: false
        default: ''
      drop_part_2:
        description: Encrypted selected-file envelope (part 2)
        type: string
        required: false
        default: ''

# Default is off. Enabling real temporary account creation requires separately
# approved production configuration and fresh per-request Cloudflare Terms consent.
env:
  WORKFLOW_ACTION_PUBLIC: "true"
  WORKFLOW_ACTION_TYPE: task
  WORKFLOW_ACTION_OUTPUT_KIND: none

permissions:
  contents: read
  id-token: write

jobs:
  drop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout dispatched revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Claim exact approved physical Task before reading file or Secrets
        shell: bash
        env:
          ATTEMPT_ID: ${{ inputs.attempt_id }}
          DISPATCH_ID: ${{ inputs.dispatch_id }}
          CAPABILITY_ID: ${{ inputs.capability_id }}
          WORKFLOW_ACTION_CLAIM_URL: ${{ vars.WORKFLOW_ACTION_CLAIM_URL }}
        run: |
          set -euo pipefail
          python3 .github/scripts/session_action.py claim

      - name: Install reviewed Wrangler CLI for an authorized deployment
        if: ${{ vars.DROP_TEMPORARY_DEPLOYMENT_AUTHORIZED == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/drop-cli" --ignore-scripts --no-audit --no-fund wrangler@4.162.0
          printf '%s\n' "$RUNNER_TEMP/drop-cli/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Stage and optionally deploy Attempt-bound static site
        shell: bash
        env:
          ATTEMPT_ID: ${{ inputs.attempt_id }}
          DISPATCH_ID: ${{ inputs.dispatch_id }}
          CAPABILITY_ID: ${{ inputs.capability_id }}
          WORKFLOW_ACTION_CLAIM_URL: ${{ vars.WORKFLOW_ACTION_CLAIM_URL }}
          DROP_RECEIPT_PUBLIC_KEY_PEM: ${{ vars.DROP_RECEIPT_PUBLIC_KEY_PEM }}
          DROP_PART_0: ${{ inputs.drop_part_0 }}
          DROP_PART_1: ${{ inputs.drop_part_1 }}
          DROP_PART_2: ${{ inputs.drop_part_2 }}
          DROP_PRIVATE_KEY_PEM: ${{ secrets.DROP_PRIVATE_KEY_PEM }}
          DROP_TEMPORARY_DEPLOYMENT_AUTHORIZED: ${{ vars.DROP_TEMPORARY_DEPLOYMENT_AUTHORIZED }}
        run: |
          set -euo pipefail
          node .github/scripts/drop_runner.mjs
