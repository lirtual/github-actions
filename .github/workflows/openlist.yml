name: openlist
on:
  workflow_dispatch:
    inputs:
      attempt_id:
        description: Server-owned logical Attempt
        type: string
        required: true
      dispatch_id:
        description: Server-owned dispatch correlation
        type: string
        required: true
      capability_id:
        description: Server-owned capability
        type: string
        required: true
      duration_minutes:
        description: Session lifetime (1-300 minutes)
        type: number
        default: 300
        required: false
      duration_mode:
        description: Explicit minutes or repository session default
        type: choice
        options:
          - explicit
          - repository
        default: explicit
        required: false

env:
  WORKFLOW_ACTION_TYPE: session
permissions:
  contents: read
  id-token: write
jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # Prevent password resets while a Session is using the persistent database.
    concurrency:
      group: openlist-persistent-database
      cancel-in-progress: false
    env:
      ATTEMPT_ID: ${{ inputs.attempt_id }}
      DISPATCH_ID: ${{ inputs.dispatch_id }}
      CAPABILITY_ID: ${{ inputs.capability_id }}
      WORKFLOW_ACTION_CLAIM_URL: ${{ vars.WORKFLOW_ACTION_CLAIM_URL }}
      WORKFLOW_ACTION_OIDC_AUDIENCE: ${{ vars.WORKFLOW_ACTION_OIDC_AUDIENCE }}
      DURATION_MINUTES: ${{ inputs.duration_mode == 'repository' && (vars.SESSION_DURATION_MINUTES || '300') || inputs.duration_minutes }}
    steps:
      - name: Capture job lifetime before checkout
        shell: bash
        run: date +%s > "$RUNNER_TEMP/session-action-start"
      - name: Checkout pinned dispatched revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Record Runner-local lifetime
        run: python3 .github/scripts/session_action.py start
      - name: Claim pinned GitHub physical Run
        run: python3 .github/scripts/session_action.py claim
      - name: Start password-protected openlist service
        shell: bash
        env:
          SESSION_SERVICE_PASSWORD: ${{ secrets.SESSION_SERVICE_PASSWORD }}
          OPENLIST_DATABASE_URI: ${{ secrets.OPENLIST_DATABASE_URI }}
          OPENLIST_DATABASE_CA: ${{ secrets.OPENLIST_DATABASE_CA }}
        run: bash .github/scripts/start-openlist.sh
      - name: Start public Quick Tunnel and verify OpenList API
        shell: bash
        env:
          SESSION_SERVICE: openlist
        run: bash .github/scripts/start-tunnel.sh
      - name: Upload temporary Tunnel locator
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: session-tunnel-url
          path: ${{ runner.temp }}/session-tunnel-url
          if-no-files-found: error
          retention-days: 1
      - name: Signed Ready after local OpenList health check
        run: python3 .github/scripts/session_action.py ready
      - name: Hold until Runner-local lifetime or cancellation
        run: python3 .github/scripts/session_action.py hold
      - name: Stop service and Cloudflare Tunnel
        if: always()
        shell: bash
        run: |
          if test -s "$RUNNER_TEMP/session-tunnel.pid"; then
            kill "$(cat "$RUNNER_TEMP/session-tunnel.pid")" 2>/dev/null || true
          fi
          if test -s "$RUNNER_TEMP/session-service.pid"; then
            kill "$(cat "$RUNNER_TEMP/session-service.pid")" 2>/dev/null || true
          fi
          docker rm --force session-chrome session-openlist >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/session-service-password" "$RUNNER_TEMP/session-tunnel-url" "$RUNNER_TEMP/session-tunnel.log" "$RUNNER_TEMP/cloudflared"
          rm -f "$RUNNER_TEMP/openlist-data/config.json"
          rm -rf "$RUNNER_TEMP/openlist-data"
