name: OpenList Session
on:
  workflow_dispatch:
    inputs:
      attempt_id:
        description: Server-owned logical Attempt
        type: string
        required: true
      dispatch_id:
        description: Server-owned dispatch correlation
        type: string
        required: true
      capability_id:
        description: Server-owned capability
        type: string
        required: true
      duration_minutes:
        description: Session lifetime (1-330 minutes)
        type: number
        default: 330
        required: false
env:
  WORKFLOW_ACTION_TYPE: session
permissions:
  contents: read
  id-token: write
jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      ATTEMPT_ID: ${{ inputs.attempt_id }}
      DISPATCH_ID: ${{ inputs.dispatch_id }}
      CAPABILITY_ID: ${{ inputs.capability_id }}
      WORKFLOW_ACTION_CLAIM_URL: ${{ vars.WORKFLOW_ACTION_CLAIM_URL }}
      WORKFLOW_ACTION_OIDC_AUDIENCE: ${{ vars.WORKFLOW_ACTION_OIDC_AUDIENCE }}
      DURATION_MINUTES: ${{ inputs.duration_minutes }}
    steps:
      - name: Checkout pinned dispatched revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Record Runner-local lifetime
        run: python3 .github/scripts/session_action.py start
      - name: Claim pinned GitHub physical Run
        run: python3 .github/scripts/session_action.py claim
      - name: Join private Tailnet
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:session-actions
      - name: Enable Tailnet SSH for port forwarding
        shell: bash
        run: |
          set -euo pipefail
          sudo tailscale set --ssh
          tailscale ip -4 >/dev/null
      - name: Start local-only OpenList container
        shell: bash
        env:
          OPENLIST_ADMIN_PASSWORD: ${{ secrets.SESSION_OPENLIST_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$OPENLIST_ADMIN_PASSWORD"
          mkdir -p "$RUNNER_TEMP/openlist-data"
          docker run --detach --rm --name session-openlist \
            --user "$(id -u):$(id -g)" \
            --publish 127.0.0.1:5244:5244 \
            --volume "$RUNNER_TEMP/openlist-data:/opt/openlist/data" \
            --env OPENLIST_ADMIN_PASSWORD \
            openlistteam/openlist:v4.2.6 >/dev/null
          ready=false
          for _ in $(seq 1 45); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:5244/ >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
      - name: Signed Ready after local OpenList health check
        run: python3 .github/scripts/session_action.py ready
      - name: Hold until Runner-local lifetime or cancellation
        run: python3 .github/scripts/session_action.py hold
      - name: Remove ephemeral container and private SSH
        if: always()
        shell: bash
        run: |
          docker rm --force session-openlist >/dev/null 2>&1 || true
          sudo tailscale set --ssh=false || true
